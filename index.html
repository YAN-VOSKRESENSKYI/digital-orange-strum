
  <!DOCTYPE html>
  <html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@100;200;300;400;500;600;700;800;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Міні-курси В лоб</title>
    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      
      var url = window.location.href.toLowerCase();
      var pixelId = localStorage.getItem('vlob_pixel_id');
      
      // Якщо в силці є 'vira' - призначаємо перший піксель
      if (url.indexOf('vira') !== -1) {
        pixelId = '433263955704286';
        localStorage.setItem('vlob_pixel_id', pixelId);
      } 
      // Якщо в силці є 'katya' - призначаємо другий піксель
      else if (url.indexOf('katya') !== -1) {
        pixelId = '1580238682530699';
        localStorage.setItem('vlob_pixel_id', pixelId);
      }
      // Якщо це прямий захід без конкретної мітки - перший піксель за замовчуванням
      else if (!pixelId) {
        pixelId = '433263955704286'; 
      }

      fbq('init', pixelId);
      fbq('track', 'PageView');
    </script>
    <noscript>
      <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=433263955704286&ev=PageView&noscript=1" />
    </noscript>
    <!-- End Meta Pixel Code -->
</head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
